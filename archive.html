<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="icon" type="image/png" href="images/white-circle.png">
    <title>Archive - Madalena Velloso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #ffffff;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            cursor: none;
            padding: 120px 40px 80px;
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 52px;
            height: 52px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        .custom-cursor img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Little Me - Static in Corner */
        .little-me {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 100px;
            height: auto;
            z-index: 1000;
            cursor: none;
            transition: transform 0.3s ease;
        }

        .little-me:hover {
            transform: scale(1.1);
        }

        /* Archive Title */
        .archive-title {
            font-size: 4rem;
            font-style: italic;
            text-align: center;
            margin-bottom: 80px;
            color: #333;
            font-weight: lighter;
        }

        /* Masonry Grid - Same as projectsection.html */
        .masonry-grid {
            column-count: 3;
            column-gap: 12px;
            padding: 0 40px;
        }

        .masonry-grid img,
        .masonry-grid video {
            width: 100%;
            margin-bottom: 12px;
            display: block;
            transition: transform 0.3s ease, opacity 0.3s ease;
            cursor: pointer;
        }

        .masonry-grid img:hover,
        .masonry-grid video:hover {
            transform: scale(1.02);
            opacity: 0.9;
        }

        /* Lightbox Styling */
        .lightbox {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(255, 255, 255, 0.96);
            backdrop-filter: blur(6px);
            justify-content: center;
            align-items: center;
            z-index: 30000;
            cursor: none;
        }

        .lightbox.show {
            display: flex;
        }

        .lightbox img,
        .lightbox video {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            transition: transform 0.4s ease;
            display: none;
        }

        .lightbox img.active,
        .lightbox video.active {
            display: block;
        }

        .lightbox img:hover,
        .lightbox video:hover {
            transform: scale(1.02);
        }

        .lightbox-close {
            position: fixed;
            top: 40px;
            right: 50px;
            font-size: 1.2rem;
            font-style: italic;
            color: #333;
            background: none;
            border: none;
            cursor: pointer;
            font-family: 'Courier New', monospace;
            z-index: 31000;
            transition: color 0.2s ease;
        }

        .lightbox-close:hover {
            color: blue;
        }

        /* Responsive */
        @media (max-width: 1024px) {
            .masonry-grid {
                column-count: 2;
                column-gap: 10px;
            }

            .masonry-grid img,
            .masonry-grid video {
                margin-bottom: 10px;
            }

            .archive-title {
                font-size: 3rem;
            }

            body {
                padding: 100px 30px 60px;
            }

            .little-me {
                width: 80px;
                top: 30px;
                left: 30px;
            }
        }

        @media (max-width: 768px) {
            body {
                cursor: auto;
                padding: 100px 20px 60px;
            }

            .custom-cursor {
                display: none;
            }

            .masonry-grid img,
            .masonry-grid video {
                cursor: pointer;
            }

            .masonry-grid {
                column-count: 2;
                padding: 0 20px;
            }

            .archive-title {
                font-size: 2.5rem;
            }

            .little-me {
                width: 70px;
                top: 20px;
                left: 20px;
            }

            .lightbox-close {
                top: 20px;
                right: 20px;
                font-size: 1rem;
            }

            .lightbox img,
            .lightbox video {
                max-width: 95%;
                max-height: 80vh;
            }
        }

        @media (max-width: 480px) {
            .masonry-grid {
                column-count: 1;
                column-gap: 0;
                padding: 0 15px;
            }

            .masonry-grid img,
            .masonry-grid video {
                margin-bottom: 12px;
            }

            .archive-title {
                font-size: 2rem;
                margin-bottom: 60px;
            }

            body {
                padding: 100px 15px 60px;
            }

            .little-me {
                width: 60px;
                top: 15px;
                left: 15px;
            }

            .lightbox-close {
                top: 15px;
                right: 15px;
                font-size: 0.95rem;
            }

            .lightbox img,
            .lightbox video {
                max-width: 95%;
                max-height: 75vh;
            }
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor">
        <img src="images/Ilustração_Sem_Título.png" alt="">
    </div>

    <!-- Little Me - Link to Home -->
    <a href="index.html">
        <img class="little-me" src="images/IMG_0465.GIF" alt="Home">
    </a>

    <!-- Archive Title -->
    <h1 class="archive-title">Archive</h1>

    <!-- Masonry Grid -->
    <div class="masonry-grid">
               <img src="images/mockup1_MUPI.jpeg" alt="Archive item 2">
                      <img src="images/Mockup2_MUPI.jpeg" alt="Archive item 2">
               <img src="images/images copy/WebP/capa zine@72x.webp" alt="Archive item 2">
        <img src="images/images copy/WebP/zine1.webp" alt="Archive item 2">
                      <img src="images/images copy/WebP/mockupzine1.webp" alt="Archive item 2">
                            <img src="images/images copy/WebP/mockupzine2.webp" alt="Archive item 2">
                            <img src="images/images copy/WebP/mockupzine3.webp" alt="Archive item 2">
        <img src="images/images copy/WebP/tejumupi1.webp" alt="Archive item 2">     
          <img src="images/images copy/WebP/tejustand.webp" alt="Archive item 2">  
                   <img src="images/WebP/billboard2.webp" alt="Archive item 2">  
               <img src="images/images copy/WebP/signse.webp" alt="Archive item 2"> 

        <img src="images/images copy/WebP/thatsenough.webp" alt="Archive item 3">
        <img src="images/New Folder With Items 2/Infograph go copy.webp" alt="Archive item 5">
        <img src="images/New Folder With Items 2/Design1.webp" alt="Archive item 6">
        <img src="images/New Folder With Items 2/Prancheta 1_1 copy.webp" alt="Archive item 8">
        <img src="images/New Folder With Items 2/POSTERSGARE.webp" alt="Archive item 9">

    </div>

    <!-- Lightbox -->
    <div id="lightbox" class="lightbox">
        <button class="lightbox-close">close</button>
        <img src="" alt="Expanded artwork">
        <video src="" controls autoplay loop></video>
    </div>

    <script>
        const customCursor = document.querySelector('.custom-cursor');

        // Custom cursor follow mouse
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });

        // Lightbox Functionality
        const lightbox = document.getElementById('lightbox');
        const lightboxImg = lightbox.querySelector('img');
        const lightboxVideo = lightbox.querySelector('video');
        const closeBtn = document.querySelector('.lightbox-close');

        document.querySelectorAll('.masonry-grid img, .masonry-grid video').forEach(media => {
            media.addEventListener('click', () => {
                if (media.tagName.toLowerCase() === 'img') {
                    lightboxImg.src = media.src;
                    lightboxImg.classList.add('active');
                    lightboxVideo.classList.remove('active');
                    lightboxVideo.pause();
                } else {
                    lightboxVideo.src = media.src;
                    lightboxVideo.classList.add('active');
                    lightboxImg.classList.remove('active');
                }
                lightbox.classList.add('show');
            });
        });

        closeBtn.addEventListener('click', () => {
            lightbox.classList.remove('show');
            lightboxImg.classList.remove('active');
            lightboxVideo.classList.remove('active');
            lightboxVideo.pause();
        });

        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                lightbox.classList.remove('show');
                lightboxImg.classList.remove('active');
                lightboxVideo.classList.remove('active');
                lightboxVideo.pause();
            }
        });
    </script>
</body>
</html>
