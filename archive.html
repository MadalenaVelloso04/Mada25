<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Archive - Madalena Velloso</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            background-image: url('images/background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            cursor: none;
            padding: 120px 40px 80px;
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 52px;
            height: 52px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        .custom-cursor img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Little Me - Static in Corner */
        .little-me {
            position: fixed;
            top: 40px;
            left: 40px;
            width: 100px;
            height: auto;
            z-index: 1000;
            cursor: none;
            transition: transform 0.3s ease;
        }

        .little-me:hover {
            transform: scale(1.1);
        }

        /* Archive Title */
        .archive-title {
            font-size: 4rem;
            font-style: italic;
            text-align: center;
            margin-bottom: 80px;
            color: #333;
        }

        /* Masonry Grid */
        .masonry-grid {
            column-count: 4;
            column-gap: 20px;
            max-width: 1600px;
            margin: 0 auto;
        }

        .grid-item {
            break-inside: avoid;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
            cursor: none;
            transition: transform 0.3s ease;
        }

        .grid-item:hover {
            transform: scale(1.02);
            z-index: 10;
        }

        .grid-item img {
            width: 100%;
            height: auto;
            display: block;
            filter: blur(4px) brightness(1.2);
            transition: filter 0.5s ease;
        }

        .grid-item::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.3);
            transition: opacity 0.5s ease;
            pointer-events: none;
        }

        .grid-item:hover img {
            filter: blur(0) brightness(1);
        }

        .grid-item:hover::after {
            opacity: 0;
        }

        /* Different sizes for variety */
        .grid-item:nth-child(3n + 1) {
            transform: scale(1.1);
        }

        .grid-item:nth-child(5n + 2) {
            transform: scale(0.9);
        }

        .grid-item:nth-child(7n + 3) {
            transform: scale(1.05);
        }

        /* Responsive */
        @media (max-width: 1200px) {
            .masonry-grid {
                column-count: 3;
            }
        }

        @media (max-width: 768px) {
            .masonry-grid {
                column-count: 2;
            }
            
            .archive-title {
                font-size: 3rem;
            }
        }

        @media (max-width: 480px) {
            .masonry-grid {
                column-count: 1;
            }
            
            .archive-title {
                font-size: 2rem;
            }

            body {
                padding: 100px 20px 60px;
            }
        }
    </style>
</head>
