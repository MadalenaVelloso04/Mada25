<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <title>Madalena Velloso - Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: #f5f5f5;
            background-image: url('images/Texture\ 1\ Large.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            overflow-x: hidden;
            cursor: none;
        }

        a, .work-item, .hamburger {
            cursor: none;
        }

        /* Custom Cursor */
        .custom-cursor {
            position: fixed;
            width: 52px;
            height: 52px;
            pointer-events: none;
            z-index: 10000;
            transform: translate(-50%, -50%);
        }

        .custom-cursor img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Hamburger Menu */
        .hamburger {
            position: fixed;
            top: 40px;
            right: 40px;
            width: 50px;
            height: 40px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .hamburger.visible {
            opacity: 1;
        }

        .hamburger span {
            width: 100%;
            height: 3px;
            background: #333;
            transition: all 0.4s ease;
        }

        .hamburger.active span:nth-child(1) {
            transform: rotate(45deg) translate(13px, 13px);
        }

        .hamburger.active span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.active span:nth-child(3) {
            transform: rotate(-45deg) translate(13px, -13px);
        }

        /* Full Screen Menu */
        .menu {
            position: fixed;
            top: 0;
            right: -100%;
            width: 100%;
            height: 100vh;
            background: rgba(255, 255, 255, 0.98);
            z-index: 999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: right 0.6s ease;
        }

        .menu.active {
            right: 0;
        }

        .menu a {
            font-size: 4rem;
            color: #333;
            text-decoration: none;
            margin: 20px 0;
            opacity: 0;
            transform: translateX(50px);
            transition: opacity 0.5s ease, transform 0.5s ease, color 0.3s ease;
            font-style: italic;
        }

        .menu.active a {
            opacity: 1;
            transform: translateX(0);
        }

        .menu.active a:nth-child(1) { transition-delay: 0.1s; }
        .menu.active a:nth-child(2) { transition-delay: 0.2s; }
        .menu.active a:nth-child(3) { transition-delay: 0.3s; }
        .menu.active a:nth-child(4) { transition-delay: 0.4s; }

        .menu a:hover {
            color: #999;
        }

        /* Fixed Side Text */
        .side-text {
            position: fixed;
            font-size: 1.5rem;
            font-style: italic;
            z-index: 100;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .side-text.visible {
            opacity: 1;
        }

        .side-text.left {
            left: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        .side-text.right {
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
        }

        /* Scroll Progress Indicator */
        .scroll-progress {
            position: fixed;
            right: 60px;
            top: 50%;
            transform: translateY(-50%);
            z-index: 100;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .scroll-progress.visible {
            opacity: 1;
        }

        .scroll-shape {
            width: 80px;
            height: 80px;
            transition: transform 0.1s linear;
        }

        .scroll-shape img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Hero Section */
        .hero {
            height: 300vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .hero-text {
            font-size: 3rem;
            font-style: italic;
            text-align: center;
            line-height: 1.6;
            transition: font-size 0.1s linear;
            max-width: 90%;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            white-space: normal;
        }

        /* Little Me Character */
        .little-me {
            position: fixed;
            width: 520px;
            height: auto;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: all 1s cubic-bezier(0.4, 0, 0.2, 1) ;
            z-index: 500;
            pointer-events: none;
            opacity: 0;
            visibility: hidden;
        }

        .little-me.visible {
            opacity: 1;
            visibility: visible;
        }

        .little-me.corner {
            top: 40px;
            left: 40px;
            width: 100px;
            transform: translate(0, 0);
        }

        /* About Section */
        .about {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 100px 20px;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .about.visible {
            opacity: 1;
        }

        .about-content {
            max-width: 800px;
            text-align: center;
        }

        .about-text {
            font-size: 2rem;
            font-style: italic;
            line-height: 1.6;
            margin-bottom: 100px;
        }

        /* Work Items */
        .work-container {
            padding: 100px 20px;
            position: relative;
            max-width: 900px;
            margin: 0 auto;
            opacity: 0;
            transition: opacity 1s ease;
        }

        .work-container.visible {
            opacity: 1;
        }

        .work-item {
            position: sticky;
            top: 10vh;
            width: 100%;
            max-width: 900px;
            margin: 0 auto 100vh;
            overflow: hidden;
            cursor: pointer;
            aspect-ratio: 1/1;
        }

        .work-item:last-child {
            margin-bottom: 100vh;
        }

        .work-image {
            width: 100%;
            height: 100%;
            background: #ddd;
            position: relative;
            transition: transform 0.6s ease;
            overflow: hidden;
        }

        .work-image img,
        .work-image video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: blur(8px) brightness(1.4);
            transition: filter 0.6s ease;
        }

        .work-image::after {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.5);
            transition: opacity 0.6s ease;
            pointer-events: none;
        }

        .work-item:hover .work-image img,
        .work-item:hover .work-image video {
            filter: blur(0) brightness(1);
        }

        .work-item:hover .work-image::after {
            opacity: 0;
        }

        .work-item:hover .work-image {
            transform: scale(1.05);
        }

        .work-title {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 2rem;
            font-style: italic;
            color: #333;
            opacity: 0;
            transition: opacity 0.5s ease;
            z-index: 10;
            pointer-events: none;
            text-align: center;
        }

        .work-item:hover .work-title {
            opacity: 1;
        }
    </style>
</head>
<body>
    <!-- Custom Cursor -->
    <div class="custom-cursor">
        <img src="images/Ilustração_Sem_Título.png" alt="">
    </div>

    <!-- Hamburger Menu -->
    <div class="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <!-- Full Screen Menu -->
    <div class="menu">
        <a href="#about">About</a>
        <a href="./projectsection.html">Works</a>
        <a href="#archive">Archive</a>
        <a href="#contacts">Contacts</a>
    </div>

    <!-- Side Text -->
    <div class="side-text left">mAdA vEllOso</div>
    <div class="side-text right">Multi-Designer</div>

    <!-- Scroll Progress -->
    <div class="scroll-progress">
        <div class="scroll-shape">
            <img src="images/Magnolia_grandiflora_-_flower_1.png" alt="Scroll indicator">
        </div>
    </div>

    <!-- Little Me Character -->
    <img class="little-me" src="images/IMG_0465.GIF" alt="Little Me">

    <!-- Hero Section -->
    <section class="hero">
        <div class="hero-text">
            Heyo! My name is Madalena Velloso, portuguese, 21 years old, based in Lisbon.
        </div>
    </section>

    <!-- About Section -->
    <section class="about">
        <div class="about-content">
            <div class="about-text">
                I'm a multi-disciplinary designer passionate about creating meaningful visual experiences.
            </div>
        </div>
    </section>

    <!-- Work Items -->
    <div class="work-container">
        <div class="work-item">
            <div class="work-image">
                <img src="images/MODIS/concept2.gif" alt="olura">
            </div>
            <div class="work-title">Body Bloom</div>
        </div>
        <div class="work-item">
            <div class="work-image">
                <video autoplay muted loop src="images/images copy/gare/App copy/video_app_behance.mp4" alt="olura"></video>
            </div>
            <div class="work-title">Nura</div>
        </div>
        <div class="work-item">
            <div class="work-image">
                <img src="images/ezgif-60cb350fb4cf7e.gif" alt="olura">
            </div>
            <div class="work-title">Time Collection</div>
        </div>
        <div class="work-item">
            <div class="work-image">
                <img src="images/book.png" alt="book">
            </div>
            <div class="work-title">Vintage Records</div>
        </div>
        <div class="work-item">
            <div class="work-image">
                <img src="images/ezgif-6b00df97da6b47.gif" alt="">
            </div>
            <div class="work-title">Ocean Wave</div>
        </div>
        <div class="work-item">
            <div class="work-image">
                <video autoplay muted loop src="images/images copy/desc/Screen Recording 2025-10-09 at 16.03.36.mov" alt=""></video>
            </div>
            <div class="work-title">Editorial Mix</div>
        </div>
    </div>

    <script>
        const heroText = document.querySelector('.hero-text');
        const littleMe = document.querySelector('.little-me');
        const aboutSection = document.querySelector('.about');
        const workContainer = document.querySelector('.work-container');
        const sideTexts = document.querySelectorAll('.side-text');
        const hamburger = document.querySelector('.hamburger');
        const scrollProgress = document.querySelector('.scroll-progress');
        const scrollShape = document.querySelector('.scroll-shape');
        const customCursor = document.querySelector('.custom-cursor');

        // Custom cursor follow mouse
        document.addEventListener('mousemove', (e) => {
            customCursor.style.left = e.clientX + 'px';
            customCursor.style.top = e.clientY + 'px';
        });

        function toggleMenu() {
            hamburger.classList.toggle('active');
            document.querySelector('.menu').classList.toggle('active');
        }

        window.addEventListener('scroll', () => {
            const scrollPos = window.scrollY;

            // Text shrinks while staying centered, then scrolls naturally
            const minSize = 1.2;
            const maxSize = 3;
            const shrinkEnd = 800;
            const scrollStart = 1000;
            
            if (scrollPos < shrinkEnd) {
                const fontSize = Math.max(minSize, maxSize - (scrollPos / shrinkEnd) * (maxSize - minSize));
                heroText.style.position = 'fixed';
                heroText.style.top = '50%';
                heroText.style.left = '50%';
                heroText.style.transform = 'translate(-50%, -50%)';
                heroText.style.fontSize = `${fontSize}rem`;
            } else if (scrollPos >= shrinkEnd && scrollPos < scrollStart) {
                heroText.style.position = 'fixed';
                heroText.style.top = '50%';
                heroText.style.left = '50%';
                heroText.style.transform = 'translate(-50%, -50%)';
                heroText.style.fontSize = `${minSize}rem`;
            } else {
                const scrollOffset = scrollPos - scrollStart;
                heroText.style.position = 'fixed';
                heroText.style.top = `calc(50% - ${scrollOffset}px)`;
                heroText.style.left = '50%';
                heroText.style.transform = 'translateX(-50%)';
                heroText.style.fontSize = `${minSize}rem`;
            }

            if (scrollPos > 400) {
                sideTexts.forEach(text => text.classList.add('visible'));
                aboutSection.classList.add('visible');
                hamburger.classList.add('visible');
                scrollProgress.classList.add('visible');
            } else {
                sideTexts.forEach(text => text.classList.remove('visible'));
                aboutSection.classList.remove('visible');
                hamburger.classList.remove('visible');
                scrollProgress.classList.remove('visible');
                littleMe.classList.remove('visible');
                littleMe.classList.remove('corner');
                workContainer.classList.remove('visible');
            }

            if (scrollPos > 600) {
                littleMe.classList.add('visible');
            } else {
                littleMe.classList.remove('visible');
            }

            const workOffset = workContainer.getBoundingClientRect().top;
            if (workOffset < window.innerHeight * 0.8) {
                workContainer.classList.add('visible');
            }

            if (workOffset < window.innerHeight * 1.3 && scrollPos > 600) {
                littleMe.style.opacity = '0.3';
                littleMe.classList.add('corner');
            } else if (scrollPos > 600) {
                littleMe.style.opacity = '1';
                littleMe.classList.remove('corner');
            }

            const docHeight = document.documentElement.scrollHeight - window.innerHeight;
            const scrollPercent = scrollPos / docHeight;
            const rotation = scrollPercent * 360;
            scrollShape.style.transform = `rotate(${rotation}deg)`;
        });

        document.querySelectorAll('.menu a').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                toggleMenu();
            });
        });
    </script>
</body>
</html>
